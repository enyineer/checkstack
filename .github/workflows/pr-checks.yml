name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  typecheck:
    name: Typecheck
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # `tsgo -b` writes incremental artifacts to per-package `.tsbuild/`
      # directories. Caching them lets PRs that don't touch source compile
      # in ~0.3s; cold runs are ~30s on the runner. The cache is ~4 MB
      # compressed so transfer overhead is sub-second.
      #
      # IMPORTANT: list explicit two-segment globs (NOT `**/.tsbuild`).
      # `**` makes the cache action walk every directory in the repo
      # (including all of `node_modules`) before filtering — that
      # enumeration alone took multiple minutes in early runs of this
      # workflow. Workspace layout is fixed (`core/*` and `plugins/*`),
      # so glob explicitly.
      - name: Restore tsgo build cache
        uses: actions/cache@v5
        with:
          path: |
            core/*/.tsbuild
            plugins/*/.tsbuild
            plugins/_test-scaffolds/*/.tsbuild
          # Strict key: only restore caches built against the exact
          # tsconfig + dependency set. Stale caches do nothing useful here
          # because tsgo would invalidate most projects on a partial match
          # anyway.
          key: tsgo-${{ runner.os }}-${{ hashFiles('**/tsconfig.json', 'core/tsconfig/**', 'package.json', 'bun.lock') }}

      - name: Typecheck
        id: typecheck
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typecheck-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typecheck-output
          path: /tmp/typecheck-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.typecheck.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  lint:
    name: Lint
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        id: lint
        run: |
          set +e
          bun run lint 2>&1 | tee /tmp/lint-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-output
          path: /tmp/lint-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.lint.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  deps:
    name: Deps
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Guards against the dependency drift cleaned up in issue #245: the same
      # external dependency declared at divergent ranges across workspace
      # package.json files (the `react-router-dom` case resolved two majors
      # into one lockfile). syncpack enforces a single shared range for the
      # unified set declared in `.syncpackrc.json`. Run `bun run deps:fix`
      # locally to auto-align, then `bun install`.
      - name: Check Dependency Alignment
        id: deps
        run: |
          set +e
          bun run deps:check 2>&1 | tee /tmp/deps-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deps-output
          path: /tmp/deps-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.deps.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  test:
    name: Test
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        id: test
        run: |
          set +e
          bun test 2>&1 | tee /tmp/test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: /tmp/test-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.test.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  # Surgical real-services integration lane (plan §14). Kept SEPARATE from
  # the fast `test` job so the unit lane stays fast: this job spins up real
  # Postgres + Redis service containers and runs ONLY the `*.it.test.ts`
  # files, gated behind `CHECKSTACK_IT=1`. The default `bun test` job above
  # never runs them because each suite is wrapped in
  # `describe.skipIf(!process.env.CHECKSTACK_IT)`.
  integration:
    name: Integration
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: checkstack
          POSTGRES_PASSWORD: checkstack
          POSTGRES_DB: checkstack
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before steps run.
        options: >-
          --health-cmd "pg_isready -U checkstack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # Wait until Redis answers PING before steps run.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHECKSTACK_IT: "1"
      CHECKSTACK_IT_PG_URL: postgres://checkstack:checkstack@localhost:5432/checkstack
      CHECKSTACK_IT_REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Integration Tests
        id: integration
        run: |
          set +e
          bun test it.test 2>&1 | tee /tmp/integration-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-output
          path: /tmp/integration-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.integration.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  security:
    name: Security
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Production Image
        run: docker build -t checkstack-prod:latest .

      - name: Trivy Image Scan
        id: trivy-image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: checkstack-prod:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          output: /tmp/trivy-image.txt

      - name: Aggregate Security Output
        id: security
        run: |
          {
            echo "🔎 Running Security Audit..."
            echo ""
            echo "🐳 --- Image Scan ---"
            cat /tmp/trivy-image.txt 2>/dev/null || echo "(no output produced)"
          } > /tmp/security-output.txt

          if [ "${{ steps.trivy-image.outcome }}" != "success" ]; then
            echo "exit_code=1" >> $GITHUB_OUTPUT
          else
            echo "exit_code=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-output
          path: /tmp/security-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.security.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  report:
    name: Report
    needs: [typecheck, lint, deps, test, integration, security]
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - name: Download Typecheck Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: typecheck-output
          path: /tmp/artifacts/typecheck
        continue-on-error: true

      - name: Download Lint Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: lint-output
          path: /tmp/artifacts/lint
        continue-on-error: true

      - name: Download Deps Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: deps-output
          path: /tmp/artifacts/deps
        continue-on-error: true

      - name: Download Test Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: test-output
          path: /tmp/artifacts/test
        continue-on-error: true

      - name: Download Integration Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: integration-output
          path: /tmp/artifacts/integration
        continue-on-error: true

      - name: Download Security Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: security-output
          path: /tmp/artifacts/security
        continue-on-error: true

      - name: Count previous failure comments
        id: count-failures
        uses: actions/github-script@v9
        with:
          script: |
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              }
            );

            const failureCount = comments.filter(
              (c) => c.body?.includes('<!-- pr-checks-report: fail -->')
            ).length;

            core.setOutput('failure_count', failureCount);
            core.info(`Found ${failureCount} previous failure comment(s)`);

      - name: Build and post report
        id: report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Determine results from job outcomes
            const typecheckResult = '${{ needs.typecheck.result }}';
            const lintResult = '${{ needs.lint.result }}';
            const depsResult = '${{ needs.deps.result }}';
            const testResult = '${{ needs.test.result }}';
            const integrationResult = '${{ needs.integration.result }}';
            const securityResult = '${{ needs.security.result }}';
            const typecheckPassed = typecheckResult === 'success' || typecheckResult === 'skipped';
            const lintPassed = lintResult === 'success' || lintResult === 'skipped';
            const depsPassed = depsResult === 'success' || depsResult === 'skipped';
            const testPassed = testResult === 'success' || testResult === 'skipped';
            const integrationPassed = integrationResult === 'success' || integrationResult === 'skipped';
            const securityPassed = securityResult === 'success' || securityResult === 'skipped';
            const allPassed = typecheckPassed && lintPassed && depsPassed && testPassed && integrationPassed && securityPassed;

            // Read output files
            function readOutput(name) {
              const filePath = path.join('/tmp/artifacts', name, `${name}-output.txt`);
              try {
                const content = fs.readFileSync(filePath, 'utf8');
                const lines = content.split('\n');
                // Keep last 100 lines to avoid massive comments
                if (lines.length > 100) {
                  return `... (truncated ${lines.length - 100} lines)\n` + lines.slice(-100).join('\n');
                }
                return content;
              } catch {
                return 'Output not available.';
              }
            }

            const previousFailures = parseInt('${{ steps.count-failures.outputs.failure_count }}', 10) || 0;
            const escalate = previousFailures >= 3;

            core.setOutput('all_passed', allPassed.toString());

            let body = '';

            if (allPassed) {
              // --- SUCCESS ---
              body = [
                '<!-- pr-checks-report: pass -->',
                '## ✅ All PR Checks Passed',
                '',
                '| Check | Status |',
                '|-------|--------|',
                '| Typecheck | ✅ Passed |',
                '| Lint | ✅ Passed |',
                '| Deps | ✅ Passed |',
                '| Test | ✅ Passed |',
                '| Integration | ✅ Passed |',
                '| Security | ✅ Passed |',
                '',
                '',
                '@enyineer All quality checks have passed. This PR is ready for your review.',
              ].join('\n');
            } else {
              // --- FAILURE ---
              const escalationNote = escalate
                ? '> ⚠️ **Escalation**: Automated fixes have not resolved the issues after 3 attempts. Manual intervention is required.\n'
                : '';

              const icon = (passed) => passed ? '✅ Passed' : '❌ Failed';

              const sections = [];

              if (!typecheckPassed) {
                const output = readOutput('typecheck');
                sections.push([
                  '<details>',
                  '<summary>❌ Typecheck Errors</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** Run `bun run typecheck` locally to reproduce these errors. Inspect the reported files and line numbers, then fix all type errors. Do not use `any` as an explicit type or `@ts-ignore` to suppress errors. Ensure all function signatures, return types, and variable types are correct.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              if (!lintPassed) {
                const output = readOutput('lint');
                sections.push([
                  '<details>',
                  '<summary>❌ Lint Errors</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** Run `bun run lint` locally to reproduce these errors. Fix all ESLint violations shown above. Never add `eslint-disable` comments to suppress errors — fix the root cause instead. Follow the project\'s coding standards.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              if (!depsPassed) {
                const output = readOutput('deps');
                sections.push([
                  '<details>',
                  '<summary>❌ Dependency Alignment Errors</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** The same external dependency is declared at divergent ranges across workspace `package.json` files. Run `bun run deps:fix` to auto-align them to the shared range (then `bun install` and commit), or run `bun run deps:check` locally to see the mismatches. The enforced set lives in `.syncpackrc.json`.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              if (!testPassed) {
                const output = readOutput('test');
                sections.push([
                  '<details>',
                  '<summary>❌ Test Failures</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** Run `bun test` locally to reproduce these failures. Read the failing test assertions carefully and fix the implementation code so the tests pass. Do not modify test expectations unless the test itself is clearly wrong. If a test is testing new functionality you introduced, make sure your implementation satisfies the test\'s contract.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              if (!integrationPassed) {
                const output = readOutput('integration');
                sections.push([
                  '<details>',
                  '<summary>❌ Integration Test Failures</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** These are the real-services integration tests (`*.it.test.ts`). To reproduce locally, start the dev services with `docker compose -f docker-compose-dev.yml up -d postgres redis`, then run `CHECKSTACK_IT=1 bun test it.test`. Read the failing assertions and fix the implementation so the tests pass against real Postgres/Redis. Do not weaken or skip the tests.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              if (!securityPassed) {
                const output = readOutput('security');
                sections.push([
                  '<details>',
                  '<summary>❌ Security Audit Failures</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** CI only enforces the image scan — run `bun run audit:image` locally to reproduce these vulnerabilities (requires building the production image). For a faster check without a Docker build, `bun run audit:security` runs a filesystem scan against your dependencies. Update the base image, runtime dependencies, or affected packages in `bun.lock` accordingly. All **CRITICAL** vulnerabilities must be resolved or ignored if they are confirmed false positives.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              // Build the trailing line based on escalation
              const trailingLine = escalate
                ? '@enyineer The above code quality issues were found in this PR. Automated fixes have not resolved them after 3 attempts. Manual intervention is required.'
                : '@enyineer The above code quality issues were found in this PR. Please fix them before merging.';

              body = [
                '<!-- pr-checks-report: fail -->',
                `## ❌ PR Checks Failed`,
                '',
                escalationNote,
                '| Check | Status |',
                '|-------|--------|',
                `| Typecheck | ${icon(typecheckPassed)} |`,
                `| Lint | ${icon(lintPassed)} |`,
                `| Deps | ${icon(depsPassed)} |`,
                `| Test | ${icon(testPassed)} |`,
                `| Integration | ${icon(integrationPassed)} |`,
                `| Security | ${icon(securityPassed)} |`,
                '',
                ...sections,
                '',
                trailingLine,
              ].join('\n');

            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            // Fail the report job if any check failed
            if (!allPassed) {
              core.setFailed('One or more PR checks failed. See the comment above for details.');
            }

