name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  typecheck:
    name: Typecheck
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # Full history so the §7.1.1 SDK-surface-drift guard (run in the
          # codegen check below) can diff the generated surface against
          # `origin/main`. A shallow checkout leaves `origin/main` unresolvable
          # and the guard would degrade to a warn-and-skip.
          fetch-depth: 0

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/bun-install

      # The committed `@checkstack/sdk` package is generated from the per-plugin
      # contracts + the script-context helper builders. This guard fails when:
      #   1. the committed files drift from a fresh generation (a `*-common`
      #      contract changed without regenerating — mirrors `references:check`);
      #   2. a pending changeset names `@checkstack/sdk` (its version is stamped
      #      from @checkstack/release, never bumped via changeset — plan §7.3);
      #   3. the published SDK surface changed vs `main` with NO pending
      #      changeset, which would leave the release version (and thus the
      #      stamped SDK version) unadvanced so the SDK silently fails to
      #      republish (plan §7.1.1).
      # Needs full history so the §7.1.1 surface diff can resolve `origin/main`.
      - name: Check @checkstack/sdk codegen is up to date
        run: bun run generate:sdk:check

      # The bundled docs index (`ai.searchDocs` / `ai.getDoc`, plan §3.4) is
      # generated from docs/src/content/docs/**. This guard fails when a docs
      # page changed without regenerating the index, so the assistant always
      # cites docs that match the running build. Run
      # `bun run generate:docs-index` and commit the change.
      - name: Check bundled docs index is up to date
        run: bun run generate:docs-index:check

      # `tsgo -b` writes incremental artifacts to per-package `.tsbuild/`
      # directories. Caching them lets PRs that don't touch source compile
      # in ~0.3s; cold runs are ~30s on the runner. The cache is ~4 MB
      # compressed so transfer overhead is sub-second.
      #
      # IMPORTANT: list explicit two-segment globs (NOT `**/.tsbuild`).
      # `**` makes the cache action walk every directory in the repo
      # (including all of `node_modules`) before filtering — that
      # enumeration alone took multiple minutes in early runs of this
      # workflow. Workspace layout is fixed (`core/*` and `plugins/*`),
      # so glob explicitly.
      - name: Restore tsgo build cache
        uses: actions/cache@v5
        with:
          path: |
            core/*/.tsbuild
            plugins/*/.tsbuild
            plugins/_test-scaffolds/*/.tsbuild
          # Strict key: only restore caches built against the exact
          # tsconfig + dependency set. Stale caches do nothing useful here
          # because tsgo would invalidate most projects on a partial match
          # anyway.
          key: tsgo-${{ runner.os }}-${{ hashFiles('**/tsconfig.json', 'core/tsconfig/**', 'package.json', 'bun.lock') }}

      - name: Typecheck
        id: typecheck
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typecheck-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typecheck-output
          path: /tmp/typecheck-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.typecheck.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  lint:
    name: Lint
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/bun-install

      - name: Lint
        id: lint
        run: |
          set +e
          bun run lint 2>&1 | tee /tmp/lint-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-output
          path: /tmp/lint-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.lint.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  deps:
    name: Deps
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/bun-install

      # Guards against the dependency drift cleaned up in issue #245: the same
      # external dependency declared at divergent ranges across workspace
      # package.json files (the `react-router-dom` case resolved two majors
      # into one lockfile). syncpack enforces a single shared range for the
      # unified set declared in `.syncpackrc.json`. Run `bun run deps:fix`
      # locally to auto-align, then `bun install`.
      # Two gates share this job:
      #  1. syncpack alignment (issue #245) — one shared range per external dep.
      #  2. managed-override drift — every SECURITY override in package.json
      #     `overrides`/`resolutions` is documented in
      #     security/managed-overrides.json and still sits at/above its
      #     safeFloor. Stops undocumented security pins (which rot silently)
      #     from sneaking in. See scripts/audit-overrides.ts.
      - name: Check Dependency Alignment
        id: deps
        run: |
          set +e
          : > /tmp/deps-output.txt
          rc=0
          echo "── syncpack alignment ──" | tee -a /tmp/deps-output.txt
          bun run deps:check 2>&1 | tee -a /tmp/deps-output.txt
          [ "${PIPESTATUS[0]}" != "0" ] && rc=1
          echo "" | tee -a /tmp/deps-output.txt
          echo "── managed-override drift ──" | tee -a /tmp/deps-output.txt
          bun run audit:overrides:check 2>&1 | tee -a /tmp/deps-output.txt
          [ "${PIPESTATUS[0]}" != "0" ] && rc=1
          echo "exit_code=$rc" >> $GITHUB_OUTPUT

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deps-output
          path: /tmp/deps-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.deps.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  test:
    name: Test
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # Full history so the §7.1.1 SDK-surface-drift guard test
          # (scripts/generate-sdk.test.ts -> resolveSurfaceBaseRef) can resolve
          # `origin/main`. A shallow checkout leaves it unresolvable and the
          # test ("resolves a real ref in this repo") fails.
          fetch-depth: 0

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/bun-install

      - name: Run Tests
        id: test
        run: |
          set +e
          # Run each workspace package's unit tests in its OWN bun process.
          # `bun test` loads every matched file's module up front in a single
          # process, so a process-global `mock.module()` (or global mutation) in
          # ANY file leaks into ALL others - which made unrelated suites (the
          # real-HTTP auth tests, the ink/yoga TUI render tests) fail only in the
          # full run while passing in isolation. Per-package isolation fixes it.
          # Excluded: the e2e Playwright specs (core/e2e/*.spec.ts, run by
          # `playwright test`) and the *.it.test.ts integration tests (their own
          # Integration job, which provisions Postgres/Redis/a registry).
          : > /tmp/test-output.txt
          overall=0
          for d in core/* plugins/* scripts; do
            [ -d "$d" ] || continue
            [ "$d" = "core/e2e" ] && continue
            files=$(git ls-files "$d/*.test.ts" "$d/*.test.tsx" | grep -v '\.it\.test\.')
            [ -z "$files" ] && continue
            echo "::group::bun test $d" | tee -a /tmp/test-output.txt
            bun test $files 2>&1 | tee -a /tmp/test-output.txt
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$rc" != "0" ] && overall=1
          done
          echo "exit_code=$overall" >> "$GITHUB_OUTPUT"

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: /tmp/test-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.test.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  # Surgical real-services integration lane (plan §14). Kept SEPARATE from
  # the fast `test` job so the unit lane stays fast: this job spins up real
  # Postgres + Redis service containers and runs ONLY the `*.it.test.ts`
  # files, gated behind `CHECKSTACK_IT=1`. The default `bun test` job above
  # never runs them because each suite is wrapped in
  # `describe.skipIf(!process.env.CHECKSTACK_IT)`.
  integration:
    name: Integration
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: checkstack
          POSTGRES_PASSWORD: checkstack
          POSTGRES_DB: checkstack
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before steps run.
        options: >-
          --health-cmd "pg_isready -U checkstack"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # Wait until Redis answers PING before steps run.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CHECKSTACK_IT: "1"
      CHECKSTACK_IT_PG_URL: postgres://checkstack:checkstack@localhost:5432/checkstack
      CHECKSTACK_IT_REDIS_URL: redis://localhost:6379
      # The external-plugin-lifecycle e2e test (#251) publishes the current
      # tree to this throwaway local registry and resolves/installs from it.
      CHECKSTACK_SCAFFOLD_REGISTRY: http://localhost:4873
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/bun-install

      # The external-plugin lifecycle test (#251 Phase 3) needs the CURRENT
      # tree's @checkstack/* packages served as PUBLISHED tarballs from a
      # local registry. We run Verdaccio as a step-spawned background process
      # (not a service container, since it needs a generated config) and
      # publish via `bun publish --registry` — which resolves workspace:* to
      # concrete versions, unlike `npm publish`. Publish lives in its own step
      # so a publish failure is attributed clearly, separate from the test.
      - name: Boot local registry and publish workspace packages
        run: |
          set -e
          REG=http://localhost:4873
          mkdir -p /tmp/verdaccio-storage
          cat > /tmp/verdaccio.yaml <<'YAML'
          storage: "/tmp/verdaccio-storage"
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
          packages:
            '@checkstack/*':
              access: $all
              publish: $anonymous
              unpublish: $anonymous
            'create-checkstack-plugin':
              access: $all
              publish: $anonymous
              unpublish: $anonymous
            '**':
              access: $all
              publish: $anonymous
              proxy: npmjs
          log: { type: stdout, format: pretty, level: warn }
          listen: 0.0.0.0:4873
          YAML
          npx --yes verdaccio --config /tmp/verdaccio.yaml > /tmp/verdaccio.log 2>&1 &
          echo "VERDACCIO_PID=$!" >> "$GITHUB_ENV"
          up=
          for i in $(seq 1 60); do
            if curl -sf "$REG/-/ping" >/dev/null 2>&1; then echo "registry up"; up=1; break; fi
            sleep 1
          done
          [ -n "$up" ] || { echo "Verdaccio did not start"; cat /tmp/verdaccio.log 2>/dev/null || true; exit 1; }
          # `bun publish` reads the registry + auth token together from
          # bunfig.toml's [install.registry]. Crucially we must NOT pass the
          # `--registry` flag on publish: it overrides .npmrc/bunfig/env
          # *including the token*, which is why publish previously failed with
          # "missing authentication". The frozen install already ran above, so
          # repointing the registry now is safe (the integration test below also
          # wants the local registry, which proxies npmjs for everything else).
          cat >> bunfig.toml <<BUNFIG

          [install.registry]
          url = "$REG/"
          token = "fake-checkstack-it-token"
          BUNFIG
          echo "BUN_CONFIG_REGISTRY=$REG" >> "$GITHUB_ENV"
          # npm-based steps (scaffolded-plugin install) read ~/.npmrc.
          cat > "$HOME/.npmrc" <<NPMRC
          registry=$REG/
          @checkstack:registry=$REG/
          //localhost:4873/:_authToken=fake-checkstack-it-token
          always-auth=false
          NPMRC
          echo "NPM_CONFIG_USERCONFIG=$HOME/.npmrc" >> "$GITHUB_ENV"
          # Publish every non-private core/* + plugins/* package. bun publish
          # resolves workspace:* to concrete versions at pack time.
          for dir in core/* plugins/*; do
            base=$(basename "$dir")
            case "$base" in _*) continue;; esac
            [ -f "$dir/package.json" ] || continue
            if node -e "process.exit(require('./$dir/package.json').private?1:0)"; then
              # No --registry flag: it overrides bunfig/.npmrc INCLUDING the auth
              # token. Registry + token come from bunfig's [install.registry].
              ( cd "$dir" && bun publish --access public ) || { echo "publish failed: $dir"; exit 1; }
            fi
          done

      # The external-plugin-lifecycle integration test drives a real browser to
      # assert @checkstack/ui's Monaco CodeEditor renders in the standalone dev
      # server, so Chromium must be available. `playwright:install` pins the
      # browser download to the bun.lock-resolved Playwright version and includes
      # the headless shell — see scripts/install-playwright.ts for the why.
      - name: Install Playwright Chromium
        run: bun run playwright:install --with-deps

      - name: Run Integration Tests
        id: integration
        run: |
          set +e
          bun test it.test 2>&1 | tee /tmp/integration-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Stop local registry
        if: always()
        run: |
          if [ -n "${VERDACCIO_PID:-}" ]; then kill "$VERDACCIO_PID" 2>/dev/null || true; fi
          cat /tmp/verdaccio.log 2>/dev/null || true

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-output
          path: /tmp/integration-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.integration.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  security:
    name: Security
    if: github.head_ref != 'changeset-release/main' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    # `packages: read` lets the build pull the release-produced registry
    # buildcache below. `contents: read` is the workflow default, restated
    # because naming a job-level permissions block drops anything not listed.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # The production image builds the Astro docs (served at /checkstack/*),
          # whose logo/images are tracked via git-LFS. Without smudged LFS files
          # the build context carries 128-byte LFS pointers and the docs build
          # fails with Astro NoImageMetadata. (deploy-docs.yml + release.yml
          # already check out with lfs: true for the same reason.)
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Best-effort login so the registry cache below is readable. Marked
      # continue-on-error so a fork PR (whose GITHUB_TOKEN can't read packages)
      # still builds — it just misses the cache and builds cold.
      - name: Login to GitHub Container Registry
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuse the amd64 buildcache that release.yml publishes for the same
      # Dockerfile — READ-ONLY (no cache-to), so PRs never write cache and the
      # 10 GB Actions Cache budget is untouched. `load: true` puts the image in
      # the local docker daemon so Trivy can scan it by tag. A cache miss (e.g.
      # before the first release writes the tag) just builds cold; it never fails.
      - name: Build Production Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: checkstack-prod:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/checkstack:buildcache-linux-amd64

      # TWO scans, both emitting JSON and NEVER failing on their own
      # (exit-code 0): the gating decision is made in the evaluate step below.
      #  - image: the runtime attack surface (OS packages + production deps).
      #  - fs: the WHOLE dependency graph from bun.lock, INCLUDING
      #    devDependencies that `bun install --production` strips from the
      #    image. This fs scan is what closes the gap that let dev-only CVEs
      #    (e.g. vite, postcss-selector-parser) stay invisible to the image
      #    scan. We deliberately do NOT pass ignore-unfixed here so unfixed
      #    findings are captured too, then surfaced as warnings (not failures).
      - name: Trivy image scan (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: checkstack-prod:latest
          format: json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          output: /tmp/trivy-image.json

      - name: Trivy filesystem scan (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          output: /tmp/trivy-fs.json

      # Gate policy:
      #  - FIXABLE findings (a fixed version exists) FAIL the job — they are
      #    actionable, so they must be remediated.
      #  - UNFIXED findings (no upstream fix yet, e.g. the alpine openssl
      #    CRITICAL or vite) are surfaced as ::warning:: annotations but DO
      #    NOT fail. The daily security-maintenance workflow re-checks these
      #    and auto-opens a remediation PR the moment a fix ships.
      - name: Evaluate findings (fail on fixable, warn on unfixed)
        id: security
        run: |
          set -euo pipefail
          for f in /tmp/trivy-image.json /tmp/trivy-fs.json; do
            [ -s "$f" ] || echo '{"Results":[]}' > "$f"
          done

          jq -s '
            [ .[].Results[]?.Vulnerabilities[]?
              | { id:.VulnerabilityID, pkg:.PkgName, installed:.InstalledVersion,
                  fixed:(.FixedVersion // ""), sev:.Severity } ]
            | unique_by(.id + "|" + .pkg + "|" + .installed)
          ' /tmp/trivy-image.json /tmp/trivy-fs.json > /tmp/vulns.json

          jq -r '[.[] | select(.fixed != "")]
            | sort_by(.sev) | reverse[]
            | "  [\(.sev)] \(.pkg) \(.installed) -> fixed in \(.fixed)  (\(.id))"' \
            /tmp/vulns.json > /tmp/fixable.txt || true
          jq -r '[.[] | select(.fixed == "")]
            | sort_by(.sev) | reverse[]
            | "  [\(.sev)] \(.pkg) \(.installed)  (\(.id)) — no upstream fix yet"' \
            /tmp/vulns.json > /tmp/unfixed.txt || true

          fixable_count=$(jq '[.[] | select(.fixed != "")] | length' /tmp/vulns.json)
          unfixed_count=$(jq '[.[] | select(.fixed == "")] | length' /tmp/vulns.json)

          {
            echo "🔎 Security Audit (image + filesystem)"
            echo ""
            echo "❌ Fixable vulnerabilities ($fixable_count) — these fail the build:"
            [ "$fixable_count" -gt 0 ] && cat /tmp/fixable.txt || echo "  (none)"
            echo ""
            echo "⚠️  Known unfixed vulnerabilities ($unfixed_count) — surfaced, not gated:"
            [ "$unfixed_count" -gt 0 ] && cat /tmp/unfixed.txt || echo "  (none)"
          } > /tmp/security-output.txt

          # Surface each unfixed finding as a GitHub warning annotation.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::warning title=Unfixed vulnerability::${line# }"
          done < /tmp/unfixed.txt

          cat /tmp/security-output.txt
          if [ "$fixable_count" -gt 0 ]; then
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
          else
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-output
          path: /tmp/security-output.txt

      - name: Set outcome
        if: always()
        run: |
          if [ "${{ steps.security.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi

  report:
    name: Report
    needs: [typecheck, lint, deps, test, integration, security]
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - name: Download Typecheck Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: typecheck-output
          path: /tmp/artifacts/typecheck
        continue-on-error: true

      - name: Download Lint Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: lint-output
          path: /tmp/artifacts/lint
        continue-on-error: true

      - name: Download Deps Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: deps-output
          path: /tmp/artifacts/deps
        continue-on-error: true

      - name: Download Test Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: test-output
          path: /tmp/artifacts/test
        continue-on-error: true

      - name: Download Integration Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: integration-output
          path: /tmp/artifacts/integration
        continue-on-error: true

      - name: Download Security Output
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: security-output
          path: /tmp/artifacts/security
        continue-on-error: true

      - name: Count previous failure comments
        id: count-failures
        uses: actions/github-script@v9
        with:
          script: |
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              }
            );

            const failureCount = comments.filter(
              (c) => c.body?.includes('<!-- pr-checks-report: fail -->')
            ).length;

            core.setOutput('failure_count', failureCount);
            core.info(`Found ${failureCount} previous failure comment(s)`);

      - name: Build and post report
        id: report
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Determine results from job outcomes
            const typecheckResult = '${{ needs.typecheck.result }}';
            const lintResult = '${{ needs.lint.result }}';
            const depsResult = '${{ needs.deps.result }}';
            const testResult = '${{ needs.test.result }}';
            const integrationResult = '${{ needs.integration.result }}';
            const securityResult = '${{ needs.security.result }}';
            const typecheckPassed = typecheckResult === 'success' || typecheckResult === 'skipped';
            const lintPassed = lintResult === 'success' || lintResult === 'skipped';
            const depsPassed = depsResult === 'success' || depsResult === 'skipped';
            const testPassed = testResult === 'success' || testResult === 'skipped';
            const integrationPassed = integrationResult === 'success' || integrationResult === 'skipped';
            const securityPassed = securityResult === 'success' || securityResult === 'skipped';
            const allPassed = typecheckPassed && lintPassed && depsPassed && testPassed && integrationPassed && securityPassed;

            // Read output files
            function readOutput(name) {
              const filePath = path.join('/tmp/artifacts', name, `${name}-output.txt`);
              try {
                const content = fs.readFileSync(filePath, 'utf8');
                const lines = content.split('\n');
                // Keep last 100 lines to avoid massive comments
                if (lines.length > 100) {
                  return `... (truncated ${lines.length - 100} lines)\n` + lines.slice(-100).join('\n');
                }
                return content;
              } catch {
                return 'Output not available.';
              }
            }

            const previousFailures = parseInt('${{ steps.count-failures.outputs.failure_count }}', 10) || 0;
            const escalate = previousFailures >= 3;

            core.setOutput('all_passed', allPassed.toString());

            let body = '';

            if (allPassed) {
              // --- SUCCESS ---
              body = [
                '<!-- pr-checks-report: pass -->',
                '## ✅ All PR Checks Passed',
                '',
                '| Check | Status |',
                '|-------|--------|',
                '| Typecheck | ✅ Passed |',
                '| Lint | ✅ Passed |',
                '| Deps | ✅ Passed |',
                '| Test | ✅ Passed |',
                '| Integration | ✅ Passed |',
                '| Security | ✅ Passed |',
                '',
                '',
                '@enyineer All quality checks have passed. This PR is ready for your review.',
              ].join('\n');
            } else {
              // --- FAILURE ---
              const escalationNote = escalate
                ? '> ⚠️ **Escalation**: Automated fixes have not resolved the issues after 3 attempts. Manual intervention is required.\n'
                : '';

              const icon = (passed) => passed ? '✅ Passed' : '❌ Failed';

              const sections = [];

              if (!typecheckPassed) {
                const output = readOutput('typecheck');
                sections.push([
                  '<details>',
                  '<summary>❌ Typecheck Errors</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** Run `bun run typecheck` locally to reproduce these errors. Inspect the reported files and line numbers, then fix all type errors. Do not use `any` as an explicit type or `@ts-ignore` to suppress errors. Ensure all function signatures, return types, and variable types are correct.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              if (!lintPassed) {
                const output = readOutput('lint');
                sections.push([
                  '<details>',
                  '<summary>❌ Lint Errors</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** Run `bun run lint` locally to reproduce these errors. Fix all ESLint violations shown above. Never add `eslint-disable` comments to suppress errors — fix the root cause instead. Follow the project\'s coding standards.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              if (!depsPassed) {
                const output = readOutput('deps');
                sections.push([
                  '<details>',
                  '<summary>❌ Dependency Alignment Errors</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** The same external dependency is declared at divergent ranges across workspace `package.json` files. Run `bun run deps:fix` to auto-align them to the shared range (then `bun install` and commit), or run `bun run deps:check` locally to see the mismatches. The enforced set lives in `.syncpackrc.json`.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              if (!testPassed) {
                const output = readOutput('test');
                sections.push([
                  '<details>',
                  '<summary>❌ Test Failures</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** Run `bun test` locally to reproduce these failures. Read the failing test assertions carefully and fix the implementation code so the tests pass. Do not modify test expectations unless the test itself is clearly wrong. If a test is testing new functionality you introduced, make sure your implementation satisfies the test\'s contract.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              if (!integrationPassed) {
                const output = readOutput('integration');
                sections.push([
                  '<details>',
                  '<summary>❌ Integration Test Failures</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** These are the real-services integration tests (`*.it.test.ts`). To reproduce locally, start the dev services with `docker compose -f docker-compose-dev.yml up -d postgres redis`, then run `CHECKSTACK_IT=1 bun test it.test`. Read the failing assertions and fix the implementation so the tests pass against real Postgres/Redis. Do not weaken or skip the tests.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              if (!securityPassed) {
                const output = readOutput('security');
                sections.push([
                  '<details>',
                  '<summary>❌ Security Audit Failures</summary>',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '**How to fix:** Only **fixable** findings (a patched version exists) fail the build; unfixed findings are surfaced as warnings, not gated. Run `bun run audit:image` (production image) and `bun run audit:security` (filesystem / full dependency graph incl. devDependencies) locally to reproduce. Bump the affected direct dependency, or for a transitive package add a documented entry to `security/managed-overrides.json` plus matching `overrides`/`resolutions` in `package.json` (then `bun install`). Re-run `bun run audit:overrides:check` to confirm the override is consistent.',
                  '',
                  '</details>',
                ].join('\n'));
              }

              // Build the trailing line based on escalation
              const trailingLine = escalate
                ? '@enyineer The above code quality issues were found in this PR. Automated fixes have not resolved them after 3 attempts. Manual intervention is required.'
                : '@enyineer The above code quality issues were found in this PR. Please fix them before merging.';

              body = [
                '<!-- pr-checks-report: fail -->',
                `## ❌ PR Checks Failed`,
                '',
                escalationNote,
                '| Check | Status |',
                '|-------|--------|',
                `| Typecheck | ${icon(typecheckPassed)} |`,
                `| Lint | ${icon(lintPassed)} |`,
                `| Deps | ${icon(depsPassed)} |`,
                `| Test | ${icon(testPassed)} |`,
                `| Integration | ${icon(integrationPassed)} |`,
                `| Security | ${icon(securityPassed)} |`,
                '',
                ...sections,
                '',
                trailingLine,
              ].join('\n');

            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            // Fail the report job if any check failed
            if (!allPassed) {
              core.setFailed('One or more PR checks failed. See the comment above for details.');
            }

