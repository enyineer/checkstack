name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  # Quality checks (typecheck, lint, test) are enforced via pr-checks.yml
  # and GitHub branch protection rules. They are not repeated here to avoid
  # ~6 minutes of redundant CI time on every merge to main.

  release:
    name: Release & Publish NPM
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      releasePublished: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run scripts/publish-packages.ts
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}


  docker:
    name: Build and Push Docker Image (${{ matrix.image }})
    needs: release
    if: needs.release.outputs.releasePublished == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: checkstack
            dockerfile: Dockerfile
          - image: checkstack-satellite
            dockerfile: Dockerfile.satellite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' ./core/release/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  create-github-release:
    name: Create GitHub Release
    needs: [release, docker]
    if: needs.release.outputs.releasePublished == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' ./core/release/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          # Start with Docker and NPM info
          cat > /tmp/changelog.md << EOF
          ## Docker Images

          \`\`\`bash
          # Core platform
          docker pull ghcr.io/${{ github.repository_owner }}/checkstack:${{ steps.version.outputs.version }}

          # Satellite agent
          docker pull ghcr.io/${{ github.repository_owner }}/checkstack-satellite:${{ steps.version.outputs.version }}
          \`\`\`

          ## NPM Packages

          All \`@checkstack/*\` packages have been published to npm.

          > ⚠️ **Note**: NPM packages require [Bun](https://bun.sh) runtime (not compatible with Node.js).

          EOF

          # Generate aggregated changelog from all packages
          echo "" >> /tmp/changelog.md
          bun run scripts/aggregate-changelog.ts >> /tmp/changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Checkstack v${{ steps.version.outputs.version }}
          body_path: /tmp/changelog.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
