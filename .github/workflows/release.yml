name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  # Quality checks (typecheck, lint, test) are enforced via pr-checks.yml
  # and GitHub branch protection rules. They are not repeated here to avoid
  # ~6 minutes of redundant CI time on every merge to main.

  release:
    name: Release & Publish NPM
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      releasePublished: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/bun-install

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run scripts/publish-packages.ts
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Best-effort: de-duplicate the Version Packages PR body.
      #
      # The changesets action generates that PR body itself, one section per
      # bumped package, so a single changeset that bumps N packages appears N
      # times. We can't configure that, so we overwrite the body with a
      # de-duplicated changelog (each change listed once with the packages it
      # touched), generated from the PR branch's post-`changeset version`
      # CHANGELOGs.
      #
      # This runs ONLY when a Version Packages PR exists, and with
      # `continue-on-error: true` so it can NEVER block a release or publish.
      # We check out the pushed `changeset-release/<baseBranch>` branch so
      # `core/release/package.json` reflects the new version and the CHANGELOGs
      # are the updated ones before generating the notes.
      - name: De-duplicate Version Packages PR body (best-effort)
        if: steps.changesets.outputs.pullRequestNumber
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.ref_name }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -euo pipefail

          # The changesets action pushed the updated CHANGELOGs to this branch.
          PR_BRANCH="changeset-release/${BASE_REF}"
          git fetch origin "${PR_BRANCH}"
          git checkout "${PR_BRANCH}"

          # Generate the de-duplicated (full, untruncated) PR body.
          bun run scripts/pr-release-notes.ts > /tmp/pr-body.md

          gh pr edit "${PR_NUMBER}" --body-file /tmp/pr-body.md


  # Multi-arch build by DIGEST: each platform builds on its OWN NATIVE runner
  # (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm), then `docker-merge`
  # assembles the manifest list. This replaces a single emulated build that ran
  # BOTH platforms on one runner: arm64 under QEMU plus both heavy frontend
  # builds contending for ~7GB RAM made the amd64 frontend build OOM-thrash and
  # appear to hang. Native runners remove the emulation AND the contention.
  docker:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.releasePublished == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `pair` is the slash-free form of `platform`, used in cache scopes and
        # artifact names (which cannot contain "/"). Kept as a static matrix
        # field so no runtime env juggling is needed.
        include:
          - image: checkstack
            dockerfile: Dockerfile
            platform: linux/amd64
            pair: linux-amd64
            runner: ubuntu-latest
          - image: checkstack
            dockerfile: Dockerfile
            platform: linux/arm64
            pair: linux-arm64
            runner: ubuntu-24.04-arm
          - image: checkstack-satellite
            dockerfile: Dockerfile.satellite
            platform: linux/amd64
            pair: linux-amd64
            runner: ubuntu-latest
          - image: checkstack-satellite
            dockerfile: Dockerfile.satellite
            platform: linux/arm64
            pair: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # Push by digest only; the merge job applies the version/latest tags
          # to the assembled manifest. Cache is scoped per image AND platform so
          # the two native builds never clobber each other's cache.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Cache lives in the GHCR registry (a dedicated `buildcache-<platform>`
          # tag per image+platform), NOT the GitHub Actions Cache. Rationale:
          # `type=gha,mode=max` exported every intermediate layer of this
          # multi-stage build for all 4 build variants on every release, churning
          # ~5.6 GB of blobs. The Actions Cache has a hard 10 GB/repo cap, so those
          # blobs evicted each other (and the useful tsgo cache) by LRU before they
          # could ever be reused — paying the full export cost every run for a low
          # hit rate. The registry cache has no such cap and survives between runs.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache-${{ matrix.pair }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache-${{ matrix.pair }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          # `__` separates image from platform: image names contain hyphens
          # ("checkstack" is a PREFIX of "checkstack-satellite"), so a hyphen
          # boundary would let the merge job's `digests-checkstack-*` glob also
          # match satellite digests. `__` never appears in an image name.
          name: digests-${{ matrix.image }}__${{ matrix.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-platform digests of each image into one multi-arch manifest
  # list and apply the version + latest tags.
  docker-merge:
    name: Merge ${{ matrix.image }} manifest
    needs: [release, docker]
    if: needs.release.outputs.releasePublished == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [checkstack, checkstack-satellite]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          # `__` boundary so this does not also match the other image's digests
          # (see the upload step's note: image names share a hyphen prefix).
          pattern: digests-${{ matrix.image }}__*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' ./core/release/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}

  create-github-release:
    name: Create GitHub Release
    needs: [release, docker-merge]
    if: needs.release.outputs.releasePublished == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' ./core/release/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          # Start with Docker and NPM info
          cat > /tmp/changelog.md << EOF
          ## Docker Images

          \`\`\`bash
          # Core platform
          docker pull ghcr.io/${{ github.repository_owner }}/checkstack:${{ steps.version.outputs.version }}

          # Satellite agent
          docker pull ghcr.io/${{ github.repository_owner }}/checkstack-satellite:${{ steps.version.outputs.version }}
          \`\`\`

          ## NPM Packages

          All \`@checkstack/*\` packages have been published to npm.

          > ⚠️ **Note**: NPM packages require [Bun](https://bun.sh) runtime (not compatible with Node.js).

          EOF

          # Generate aggregated changelog from all packages
          echo "" >> /tmp/changelog.md
          bun run scripts/aggregate-changelog.ts >> /tmp/changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Checkstack v${{ steps.version.outputs.version }}
          body_path: /tmp/changelog.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
