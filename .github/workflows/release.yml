name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  # Quality checks (typecheck, lint, test) are enforced via pr-checks.yml
  # and GitHub branch protection rules. They are not repeated here to avoid
  # ~6 minutes of redundant CI time on every merge to main.

  release:
    name: Release & Publish NPM
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      releasePublished: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run scripts/publish-packages.ts
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Best-effort: de-duplicate the Version Packages PR body.
      #
      # The changesets action generates that PR body itself, one section per
      # bumped package, so a single changeset that bumps N packages appears N
      # times. We can't configure that, so we overwrite the body with a
      # de-duplicated changelog (each change listed once with the packages it
      # touched), generated from the PR branch's post-`changeset version`
      # CHANGELOGs.
      #
      # This runs ONLY when a Version Packages PR exists, and with
      # `continue-on-error: true` so it can NEVER block a release or publish.
      # We check out the pushed `changeset-release/<baseBranch>` branch so
      # `core/release/package.json` reflects the new version and the CHANGELOGs
      # are the updated ones before generating the notes.
      - name: De-duplicate Version Packages PR body (best-effort)
        if: steps.changesets.outputs.pullRequestNumber
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.ref_name }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -euo pipefail

          # The changesets action pushed the updated CHANGELOGs to this branch.
          PR_BRANCH="changeset-release/${BASE_REF}"
          git fetch origin "${PR_BRANCH}"
          git checkout "${PR_BRANCH}"

          # Generate the de-duplicated (full, untruncated) PR body.
          bun run scripts/pr-release-notes.ts > /tmp/pr-body.md

          gh pr edit "${PR_NUMBER}" --body-file /tmp/pr-body.md


  docker:
    name: Build and Push Docker Image (${{ matrix.image }})
    needs: release
    if: needs.release.outputs.releasePublished == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: checkstack
            dockerfile: Dockerfile
          - image: checkstack-satellite
            dockerfile: Dockerfile.satellite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' ./core/release/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  create-github-release:
    name: Create GitHub Release
    needs: [release, docker]
    if: needs.release.outputs.releasePublished == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(jq -r '.version' ./core/release/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          # Start with Docker and NPM info
          cat > /tmp/changelog.md << EOF
          ## Docker Images

          \`\`\`bash
          # Core platform
          docker pull ghcr.io/${{ github.repository_owner }}/checkstack:${{ steps.version.outputs.version }}

          # Satellite agent
          docker pull ghcr.io/${{ github.repository_owner }}/checkstack-satellite:${{ steps.version.outputs.version }}
          \`\`\`

          ## NPM Packages

          All \`@checkstack/*\` packages have been published to npm.

          > ⚠️ **Note**: NPM packages require [Bun](https://bun.sh) runtime (not compatible with Node.js).

          EOF

          # Generate aggregated changelog from all packages
          echo "" >> /tmp/changelog.md
          bun run scripts/aggregate-changelog.ts >> /tmp/changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Checkstack v${{ steps.version.outputs.version }}
          body_path: /tmp/changelog.md
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
