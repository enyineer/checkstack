name: Security Maintenance

# Daily security hygiene that runs against the CURRENT main + the PUBLISHED
# image, decoupled from PRs so newly-disclosed CVEs and newly-available fixes
# surface even when nobody opens a PR. It does two things:
#
#   1. Override lifecycle — re-resolves every entry in
#      security/managed-overrides.json with the override removed. Any override
#      the graph no longer needs is auto-pruned and proposed as a PR.
#
#   2. Fix-available watch — scans the published image (OS + runtime) and the
#      filesystem (full dependency graph, incl. devDependencies) and reports
#      every FIXABLE finding. Unfixed findings (e.g. the alpine openssl
#      CRITICAL, vite) flip into this list the moment upstream ships a fix, so
#      a tracking issue is upserted to notify the maintainer. This is the
#      "tell me when there's a fix" mechanism.

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: security-maintenance
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

jobs:
  maintain:
    name: Audit overrides & watch for fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/bun-install

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan the PUBLISHED image (what is actually deployed / what the company
      # scans) + the filesystem. exit-code 0: this job never fails on findings;
      # it reports and opens PRs/issues instead.
      - name: Trivy image scan (published)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/checkstack:latest
          format: json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          output: /tmp/img.json

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          output: /tmp/fs.json

      - name: Build CVE report
        id: cve
        run: |
          set -euo pipefail
          for f in /tmp/img.json /tmp/fs.json; do
            [ -s "$f" ] || echo '{"Results":[]}' > "$f"
          done

          jq -s '
            [ .[].Results[]?.Vulnerabilities[]?
              | { id:.VulnerabilityID, pkg:.PkgName, installed:.InstalledVersion,
                  fixed:(.FixedVersion // ""), sev:.Severity } ]
            | unique_by(.id + "|" + .pkg + "|" + .installed)
          ' /tmp/img.json /tmp/fs.json > /tmp/vulns.json

          fixable=$(jq '[.[] | select(.fixed != "")] | length' /tmp/vulns.json)
          {
            echo "### Fixable vulnerabilities (a patched version exists): ${fixable}"
            echo ""
            if [ "$fixable" -gt 0 ]; then
              jq -r '[.[] | select(.fixed != "")] | sort_by(.sev) | reverse[]
                | "- **\(.sev)** `\(.pkg)` \(.installed) → fixed in **\(.fixed)** (\(.id))"' /tmp/vulns.json
            else
              echo "_None._"
            fi
            echo ""
            echo "<details><summary>Known unfixed (monitoring only)</summary>"
            echo ""
            jq -r '[.[] | select(.fixed == "")] | sort_by(.sev) | reverse[]
              | "- \(.sev) `\(.pkg)` \(.installed) (\(.id))"' /tmp/vulns.json
            echo ""
            echo "</details>"
          } > /tmp/cve-report.md
          echo "fixable_count=$fixable" >> "$GITHUB_OUTPUT"

      # Hand the normalized findings to the `remediate` job (a separate, clean
      # checkout) so override-pruning and auto-remediation never edit the same
      # working tree and cross-contaminate their PRs.
      - name: Upload findings
        uses: actions/upload-artifact@v7
        with:
          name: security-vulns
          path: /tmp/vulns.json
          retention-days: 1

      # Re-resolve each managed override with it removed; prune any that the
      # graph no longer needs, then refresh the lockfile. Produces a working-
      # tree diff (package.json + manifest + bun.lock) only when something was
      # pruned — create-pull-request no-ops without a diff.
      - name: Prune redundant overrides
        id: prune
        run: |
          set -euo pipefail
          bun run audit:overrides:redundant --json > /tmp/redundant.json || true
          bun run audit:overrides:prune | tee /tmp/prune.txt
          # The prune rewrites ONLY package.json + the manifest (never bun.lock).
          # If neither changed, nothing was pruned — do NOT run `bun install`,
          # because bun re-serializes bun.lock even on a no-op ("Saved lockfile"),
          # which would otherwise open a spurious lockfile-only PR every day.
          # Trivy's .cache/ DB is gitignored and out of scope here regardless.
          if [ -n "$(git status --porcelain -- package.json security/managed-overrides.json)" ]; then
            bun install
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # A prune is "redundant" only against each removed package's OWN safeFloor;
      # it cannot see a DIFFERENT (unmanaged, transitive) package that the lockfile
      # re-resolution drags down to a vulnerable version once the pins come out.
      # Re-scan the pruned tree and refuse to surface a prune that re-introduces a
      # FIXABLE CVE - revert it so no PR is opened.
      - name: Trivy filesystem re-scan (after prune)
        if: steps.prune.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM
          output: /tmp/fs-after.json

      - name: Verify prune introduces no new fixable CVEs
        id: verify
        if: steps.prune.outputs.changed == 'true'
        run: |
          set -euo pipefail
          [ -s /tmp/fs-after.json ] || echo '{"Results":[]}' > /tmp/fs-after.json
          jq -s '
            [ .[].Results[]?.Vulnerabilities[]?
              | { id:.VulnerabilityID, pkg:.PkgName, installed:.InstalledVersion,
                  fixed:(.FixedVersion // ""), sev:.Severity } ]
            | unique_by(.id + "|" + .pkg + "|" + .installed)
          ' /tmp/fs-after.json > /tmp/vulns-after.json
          if bun run scripts/audit-overrides.ts --verify-prune /tmp/vulns.json /tmp/vulns-after.json; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Override prune blocked::Pruning redundant overrides re-introduced a fixable CVE; reverting and skipping the PR (see the log for the offending package)."
            git checkout -- package.json bun.lock security/managed-overrides.json
          fi

      - name: Compose PR body
        if: steps.prune.outputs.changed == 'true' && steps.verify.outputs.safe == 'true'
        run: |
          {
            echo "Automated by the daily **Security Maintenance** workflow."
            echo ""
            echo "## Redundant overrides removed"
            echo ""
            echo "These security overrides are no longer needed — the dependency graph"
            echo "now resolves at/above their \`safeFloor\` without the pin:"
            echo ""
            sed 's/^/- /' /tmp/prune.txt | grep -i pruned || cat /tmp/prune.txt
            echo ""
            echo "## Current CVE state"
            echo ""
            cat /tmp/cve-report.md
          } > /tmp/pr-body.md

      - name: Open / update override-removal PR
        if: steps.prune.outputs.changed == 'true' && steps.verify.outputs.safe == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # See the remediation PR step for why a non-GITHUB_TOKEN identity is
          # needed for CI to run on the created PR.
          token: ${{ secrets.SECURITY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/security-maintenance
          base: main
          commit-message: "chore(security): prune redundant managed overrides"
          title: "chore(security): prune redundant managed overrides"
          body-path: /tmp/pr-body.md
          labels: security-maintenance
          delete-branch: true
          # Commit ONLY the files the prune rewrites — never the Trivy DB or any
          # other untracked working-tree artifact.
          add-paths: |
            package.json
            bun.lock
            security/managed-overrides.json

      # Surface fixable CVEs that need a human decision (version bumps can be
      # breaking, so they are NOT auto-applied) via a single upserted issue.
      - name: Upsert CVE tracking issue
        if: steps.cve.outputs.fixable_count != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/cve-report.md', 'utf8');
            const marker = '<!-- security-maintenance-cve -->';
            const title = '🔒 Security: fixable vulnerabilities available';
            const body = [
              marker,
              '',
              'The daily Security Maintenance scan found vulnerabilities with an **available fix**.',
              'Version bumps can be breaking, so they are not auto-applied — review and bump the',
              'affected direct dependency, or add a documented entry to `security/managed-overrides.json`.',
              '',
              report,
              '',
              `_Last updated: run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`,
            ].join('\n');

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-maintenance',
              per_page: 100,
            });
            const hit = existing.find((i) => i.body && i.body.includes(marker));

            if (hit) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: hit.number,
                body,
              });
              core.info(`Updated issue #${hit.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-maintenance'],
              });
              core.info('Created new CVE tracking issue');
            }

      # When nothing is fixable anymore (e.g. after a remediation PR merged),
      # close the tracking issue so it doesn't linger showing stale CVEs. The
      # `Closes #N` in the remediation PR usually handles this on merge; this is
      # the backstop for the case where the issue outlived its findings.
      - name: Close tracking issue when clear
        if: steps.cve.outputs.fixable_count == '0'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- security-maintenance-cve -->';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-maintenance',
              per_page: 100,
            });
            for (const issue of open.filter((i) => i.body && i.body.includes(marker))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'No fixable vulnerabilities remain — closing automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              core.info(`Closed tracking issue #${issue.number}`);
            }

  # Auto-remediate fixable findings into a CI-gated PR. Runs in its OWN clean
  # checkout (separate from `maintain`) so it never shares a working tree with
  # the override-prune step and can't cross-contaminate the two PRs. This
  # GENERATES, never merges: the PR must pass full CI (typecheck/lint/test/build
  # + the Security gate) before a human merges it. The remediator never makes an
  # automatic major bump (the proto-loader trap); major-only fixes are listed in
  # the PR body for manual handling.
  remediate:
    name: Auto-remediate fixable vulnerabilities
    needs: maintain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/bun-install

      - name: Download findings
        uses: actions/download-artifact@v8
        with:
          name: security-vulns
          path: /tmp

      - name: Plan & apply remediations
        id: remediate
        run: |
          set -euo pipefail
          bun run security:remediate /tmp/vulns.json
          # Scope the change check to the files the remediator rewrites (same
          # rationale as the prune step): root + workspace manifests (range
          # bumps), the lockfile, the override manifest, and the changeset.
          if [ -n "$(git status --porcelain -- package.json 'core/*/package.json' 'plugins/*/package.json' bun.lock security/managed-overrides.json .changeset/auto-security-remediation.md)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Auto-close the CVE tracking issue when THIS PR remediates everything (no
      # major-only findings remain for a human). `Closes #N` in the body closes
      # the issue the moment the PR merges to main.
      - name: Link tracking issue for closure
        if: steps.remediate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$(jq 'length' /tmp/remediation-manual.json)" = "0" ]; then
            num=$(gh issue list --label security-maintenance --state open --json number,body \
              --jq 'map(select(.body | contains("<!-- security-maintenance-cve -->")))[0].number // empty')
            if [ -n "$num" ]; then
              printf '\nCloses #%s\n' "$num" >> /tmp/remediation-summary.md
              echo "Will close tracking issue #$num on merge."
            fi
          fi

      - name: Open / update remediation PR
        if: steps.remediate.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # A non-GITHUB_TOKEN identity is REQUIRED for the PR's CI to run:
          # GitHub does not trigger workflows on PRs opened by GITHUB_TOKEN (they
          # land in `action_required`). Create a SECURITY_BOT_TOKEN secret (a
          # fine-grained PAT or GitHub App token with contents+pull-requests
          # write, plus workflows) so the auto-PR is CI-gated end to end; until
          # then it falls back to GITHUB_TOKEN and a maintainer must "Approve and
          # run" the checks manually.
          token: ${{ secrets.SECURITY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/security-remediation
          base: main
          commit-message: "fix(security): auto-remediate fixable vulnerabilities"
          title: "fix(security): auto-remediate fixable vulnerabilities"
          body-path: /tmp/remediation-summary.md
          labels: security-maintenance
          delete-branch: true
          # Range-bumps edit workspace manifests too, so commit those alongside
          # the root/lockfile/override/changeset files — never anything else.
          add-paths: |
            package.json
            core/*/package.json
            plugins/*/package.json
            bun.lock
            security/managed-overrides.json
            .changeset/auto-security-remediation.md
