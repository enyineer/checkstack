name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "core/ui/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Required: SVG/PNG/etc. assets (logo, favicons) are stored
          # in Git LFS — see .gitattributes. Without this the runner
          # gets pointer files and Astro fails with NoImageMetadata.
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Astro 6 hard-requires Node ≥ 22.12 at runtime. `bun run` defers to
      # the system `node` binary for shebang-based CLIs like astro, so the
      # runner's default (Node 20) makes the build fail with
      # "Node.js v20.20.2 is not supported by Astro!". Install Node 22 on
      # PATH so bun finds a compatible interpreter for the docs build.
      - name: Setup Node 22 (required by Astro)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Astro Starlight site
        run: bun run --filter '@checkstack/docs' build

      - name: Build Storybook
        run: bun run --filter '@checkstack/ui' storybook:build

      - name: Assemble Pages artifact
        run: |
          mkdir -p ./_site
          cp -r ./docs/dist/. ./_site/
          mkdir -p ./_site/storybook
          cp -r ./core/ui/storybook-static/. ./_site/storybook/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
