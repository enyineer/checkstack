name: checkstack

services:
  checkstack:
    image: ghcr.io/enyineer/checkstack:latest
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-checkstack}:${POSTGRES_PASSWORD:-checkstack}@postgres:5432/${POSTGRES_DB:-checkstack}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checkstack}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Satellite agent for remote health check execution.
  # Uncomment and configure to deploy satellites alongside the core.
  #
  # satellite:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.satellite
  #   restart: always
  #   environment:
  #     CHECKSTACK_CORE_URL: http://checkstack:3000
  #     CHECKSTACK_SATELLITE_CLIENT_ID: ${SATELLITE_CLIENT_ID}
  #     CHECKSTACK_SATELLITE_TOKEN: ${SATELLITE_TOKEN}
  #   depends_on:
  #     checkstack:
  #       condition: service_started

volumes:
  postgres_data:

